---
 - name: Creating a LVM
   hosts: all

   tasks:
     - name: creating dir
       file:
         path: /lvm
         state: directory

     - name: creating vg
       lvg:
         vg: myvg
         pvs: /dev/sdc
         state: present 


     - name: creating lvm
       lvol:
         vg: myvg
         lv: mylv
         size: 720M
         pvs:
           - /dev/sdc
         state: present

     - name: formatting with fs
       filesystem:
         fstype: ext4
         dev: /dev/myvg/mylv

     - name: mounting the lvm
       mount:
         path: /lvm
         src: /dev/myvg/mylv
         fstype: ext4
         state: mounted
