---
 - name: Setup Nginx
   hosts: all
   become: true

   tasks:
     - name: Installing Nginx
       dnf:
         name: nginx
         state: latest
       notify: restart nginx

     - name: Copying Nginx template
       template:
         src: nginx.conf.j2
         dest: /etc/nginx/conf.d/custom.conf

   handlers: 
     - name: restart nginx
       service:
         name: nginx
         state: started
         enabled: yes
