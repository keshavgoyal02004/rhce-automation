---
 - name: Install a webserver
   hosts: all
   tasks:
     - name: install httpd for webserver
       yum:
         name: httpd
         state: present

     - name: Copy Config file
       template:
         src: vhost.j2
         dest: /etc/httpd/conf.d/abc.conf

     - name: create docroot 
       file:
         name: "{{ my_docroot }}"
         state: directory

     - name: Copy Index File
       template:
         src: index.html.j2
         dest: "{{ my_docroot }}/index.html"

     - name: Starting Service
       service:
         name: httpd
         state: started

     - name: firewall port
       firewalld:
         port: 80/tcp
         state: enabled
         immediate: yes
         permanent: yes

...
