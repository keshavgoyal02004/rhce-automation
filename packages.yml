---
 - name: Install Packacges
   hosts: dev

   tasks: 
     - name: install php and mariadb
       yum:
         name: 
           - php
           - mariadb-server
         state: present

 - name: install group packages
   hosts: prod

   tasks: 
     - name: Install group Package
       yum: 
         name: '@RPM Development Tools'
         state: present

 - name: Update Packages
   hosts: all

   tasks: 
     - name: updating all
       yum: 
         name: '*'
         state: latest
